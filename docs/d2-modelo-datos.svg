<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
<rect width="1180" height="620" fill="#FFFFFF"/>
<text x="590" y="34" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#0B1B4D" text-anchor="middle">Modelo de datos — colecciones de Firestore</text>
<line x1="440" y1="44" x2="740" y2="44" stroke="#B97E00" stroke-width="2.5"/>
<rect x="50" y="90" width="280" height="215" rx="10" fill="#F2F6FF" stroke="#27407F" stroke-width="1.6"/><text x="190" y="114" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#0846F0" text-anchor="middle">👤 usuarios / {uid}</text><line x1="62" y1="123" x2="318" y2="123" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="64" y="142" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">uid · correo · nombre · area</text><text x="64" y="159" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">vinculo: 'empleado' | 'externo'</text><text x="64" y="176" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">moneda (COP, MXN, CLP, …)</text><text x="64" y="193" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">rol: 'jugador' | 'admin'</text><text x="64" y="210" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">estado: 'activo' | 'pendiente'</text><text x="64" y="227" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">pagado: bool · campeon: código</text><text x="64" y="244" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">creado: timestamp (desempate)</text><rect x="470" y="90" width="300" height="150" rx="10" fill="#EAF7EF" stroke="#27407F" stroke-width="1.6"/><text x="620" y="114" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#168A41" text-anchor="middle">✏️ predicciones / {uid__pid}</text><line x1="482" y1="123" x2="758" y2="123" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="484" y="142" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">uid → usuarios</text><text x="484" y="159" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">pid → partido del fixture</text><text x="484" y="176" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">gl, gv: goles pronosticados (0–15)</text><text x="484" y="193" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">t: fecha del pronóstico</text><rect x="470" y="300" width="300" height="140" rx="10" fill="#FDEEF0" stroke="#27407F" stroke-width="1.6"/><text x="620" y="324" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#C42A3E" text-anchor="middle">🥅 resultados / {pid}</text><line x1="482" y1="333" x2="758" y2="333" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="484" y="352" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">estado: 'en_juego' | 'finalizado'</text><text x="484" y="369" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">gl, gv: marcador real · minuto</text><text x="484" y="386" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">ganadorPenales (solo llaves)</text><text x="484" y="403" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">⚠ su existencia BLOQUEA pronósticos</text><rect x="840" y="90" width="300" height="140" rx="10" fill="#FFF7E6" stroke="#27407F" stroke-width="1.6"/><text x="990" y="114" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#B97E00" text-anchor="middle">📅 ajustes / {pid}</text><line x1="852" y1="123" x2="1128" y2="123" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="854" y="142" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">utc: hora confirmada del partido</text><text x="854" y="159" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">sede · estadio</text><text x="854" y="176" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">local / visitante (eliminatorias)</text><text x="854" y="193" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">Solo escriben los admins</text><rect x="840" y="290" width="300" height="120" rx="10" fill="#FFF7E6" stroke="#27407F" stroke-width="1.6"/><text x="990" y="314" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#B97E00" text-anchor="middle">🏅 publico / tabla</text><line x1="852" y1="323" x2="1128" y2="323" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="854" y="342" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">filas: tabla oficial publicada</text><text x="854" y="359" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">t: fecha de publicación</text><text x="854" y="376" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">La ven todos; la publica el admin</text><rect x="840" y="450" width="300" height="100" rx="10" fill="#F2F6FF" stroke="#27407F" stroke-width="1.6"/><text x="990" y="474" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#0846F0" text-anchor="middle">🔑 configuracion / admins</text><line x1="852" y1="483" x2="1128" y2="483" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="854" y="502" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">correos: [lista de admins]</text><text x="854" y="519" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">Solo editable desde la consola</text><rect x="50" y="380" width="280" height="130" rx="10" fill="#EEF1F8" stroke="#27407F" stroke-width="1.6"/><text x="190" y="404" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#5F719F" text-anchor="middle">⚽ FIXTURE (js/fixture.js)</text><line x1="62" y1="413" x2="318" y2="413" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="64" y="432" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">104 partidos embebidos en el código</text><text x="64" y="449" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">id (pid) · fase · grupo · jornada</text><text x="64" y="466" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">local · visitante · utc · sede</text><text x="64" y="483" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">No vive en la base: es la fuente</text><defs><marker id="fky2gv5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4F8F"/></marker></defs><path d="M 330 150 L 470 150" fill="none" stroke="#3A4F8F" stroke-width="1.8"  marker-end="url(#fky2gv5)"/><text x="400" y="144" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#5F719F" text-anchor="middle">1 → N</text><defs><marker id="fbklami" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4F8F"/></marker></defs><path d="M 300 380 L 500 240" fill="none" stroke="#3A4F8F" stroke-width="1.8"  marker-end="url(#fbklami)"/><text x="400" y="302" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#5F719F" text-anchor="middle">pid</text><defs><marker id="feagiiy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4F8F"/></marker></defs><path d="M 330 430 L 470 390" fill="none" stroke="#3A4F8F" stroke-width="1.8"  marker-end="url(#feagiiy)"/><text x="400" y="402" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#5F719F" text-anchor="middle">pid</text><defs><marker id="fcodo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4F8F"/></marker></defs><path d="M 330 500 L 800 500 L 800 160 L 840 160" fill="none" stroke="#3A4F8F" stroke-width="1.8" marker-end="url(#fcodo)"/><text x="565" y="492" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#5F719F" text-anchor="middle">pid</text><text x="590" y="575" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#5F719F" text-anchor="middle">pid = id del partido en el FIXTURE (p. ej. g-1-K-1 o ko-104).</text><text x="590" y="595" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#5F719F" text-anchor="middle">Las reglas de Firestore validan cada escritura: dueño correcto, goles 0–15 y partido aún abierto.</text></svg>