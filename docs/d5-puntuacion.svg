<line x1="440" y1="44" x2="740" y2="44" stroke="#B97E00" stroke-width="2.5"/>
<rect x="470" y="80" width="240" height="60" rx="10" fill="#F2F6FF" stroke="#27407F" stroke-width="1.6"/><text x="590" y="104" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#0846F0" text-anchor="middle">🥅 Partido FINALIZADO</text><line x1="482" y1="113" x2="698" y2="113" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="484" y="132" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">(marcador a los 90′ + prórroga)</text><polygon points="590,180 710,230 590,280 470,230" fill="#FFF7E6" stroke="#27407F" stroke-width="1.6"/><text x="590" y="226" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold" fill="#0B1B4D" text-anchor="middle">¿Pronóstico igual</text><text x="590" y="244" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold" fill="#0B1B4D" text-anchor="middle">al marcador real?</text><defs><marker id="f2as9ej" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4F8F"/></marker></defs><path d="M 590 140 L 590 180" fill="none" stroke="#3A4F8F" stroke-width="1.8"  marker-end="url(#f2as9ej)"/><rect x="160" y="200" width="230" height="90" rx="10" fill="#EAF7EF" stroke="#27407F" stroke-width="1.6"/><text x="275" y="224" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#168A41" text-anchor="middle">🎯 MARCADOR EXACTO</text><line x1="172" y1="233" x2="378" y2="233" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="174" y="252" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">Fase de grupos: +3 pts</text><text x="174" y="269" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">Eliminatorias: +5 pts</text><defs><marker id="ffzxyxs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4F8F"/></marker></defs><path d="M 470 230 L 390 240" fill="none" stroke="#3A4F8F" stroke-width="1.8"  marker-end="url(#ffzxyxs)"/><text x="430" y="229" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#5F719F" text-anchor="middle">Sí</text><polygon points="590,350 710,400 590,450 470,400" fill="#FFF7E6" stroke="#27407F" stroke-width="1.6"/><text x="590" y="396" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold" fill="#0B1B4D" text-anchor="middle">¿Acertó ganador</text><text x="590" y="414" font-family="DejaVu Sans, sans-serif" font-size="13.5" font-weight="bold" fill="#0B1B4D" text-anchor="middle">o empate (1X2)?</text><defs><marker id="fbi22vl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4F8F"/></marker></defs><path d="M 590 280 L 590 350" fill="none" stroke="#3A4F8F" stroke-width="1.8"  marker-end="url(#fbi22vl)"/><text x="590" y="309" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#5F719F" text-anchor="middle">No</text><rect x="160" y="370" width="230" height="90" rx="10" fill="#EAF7EF" stroke="#27407F" stroke-width="1.6"/><text x="275" y="394" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#168A41" text-anchor="middle">✔ RESULTADO</text><line x1="172" y1="403" x2="378" y2="403" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="174" y="422" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">Fase de grupos: +1 pt</text><text x="174" y="439" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">Eliminatorias: +2 pts</text><defs><marker id="fgudpfk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4F8F"/></marker></defs><path d="M 470 400 L 390 410" fill="none" stroke="#3A4F8F" stroke-width="1.8"  marker-end="url(#fgudpfk)"/><text x="430" y="399" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#5F719F" text-anchor="middle">Sí</text><rect x="480" y="510" width="220" height="60" rx="10" fill="#FDEEF0" stroke="#27407F" stroke-width="1.6"/><text x="590" y="534" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#C42A3E" text-anchor="middle">✖ 0 puntos</text><line x1="492" y1="543" x2="688" y2="543" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="494" y="562" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">Habrá revancha en el próximo</text><defs><marker id="fwga0nm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A4F8F"/></marker></defs><path d="M 590 450 L 590 510" fill="none" stroke="#3A4F8F" stroke-width="1.8"  marker-end="url(#fwga0nm)"/><text x="590" y="474" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="bold" fill="#5F719F" text-anchor="middle">No</text><rect x="830" y="200" width="290" height="130" rx="10" fill="#FFF7E6" stroke="#27407F" stroke-width="1.6"/><text x="975" y="224" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#B97E00" text-anchor="middle">🏆 BONO DE CAMPEÓN</text><line x1="842" y1="233" x2="1108" y2="233" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="844" y="252" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">Se elige antes del partido inaugural</text><text x="844" y="269" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">(11 jun · 19:00 UTC).</text><text x="844" y="286" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">Al terminar la final: +10 pts</text><text x="844" y="303" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">si el elegido levanta la copa.</text><rect x="830" y="400" width="290" height="130" rx="10" fill="#F2F6FF" stroke="#27407F" stroke-width="1.6"/><text x="975" y="424" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="bold" fill="#0846F0" text-anchor="middle">🤝 DESEMPATES (en orden)</text><line x1="842" y1="433" x2="1108" y2="433" stroke="#27407F" stroke-width="0.8" opacity="0.5"/><text x="844" y="452" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">1) Puntos totales</text><text x="844" y="469" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">2) Marcadores exactos</text><text x="844" y="486" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">3) Resultados acertados</text><text x="844" y="503" font-family="DejaVu Sans, sans-serif" font-size="12.5" font-weight="normal" fill="#0B1B4D" text-anchor="start">4) Registro más antiguo</text><text x="590" y="600" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="normal" fill="#5F719F" text-anchor="middle">En eliminatorias se califica el marcador final del juego; los penales solo definen quién avanza.</text></svg>